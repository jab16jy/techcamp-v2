# ast-grep rules for the invariants the docs already state and RDD had to catch by
# review (#139). Everything is resolved from the repository root, which is where
# `gate-fast`, CI and an agent run it from: `uv run ast-grep test` proves the rules,
# `uv run ast-grep scan` applies them.
#
# A rule path is relative to this file, so a rule says which tree it governs. Keep the
# first word of every `message` on the rule id: the message is what a developer reads
# in CI, and the id is what they suppress deliberately.

ruleDirs:
  - rules

# Rule tests: one file per rule, valid and invalid snippets, the snapshot generated by
# `uv run ast-grep test --update-all` pinning the reported error output.
testConfigs:
  - testDir: rule-tests
