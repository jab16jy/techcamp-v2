# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit review rules. The GitHub App installation turns reviews on; this file only
# shapes them. AGENTS.md is the project's rulebook and docs/ is the source of truth.
language: en-US
tone_instructions: "Concise and direct. Cite the docs/ section or ADR behind a behavior claim."

reviews:
  profile: chill
  high_level_summary: true
  poem: false
  auto_review:
    # The default is [], which reviews only the repository's default branch. Epics
    # deliver as a stack whose PRs base on the previous slice, so every one of them
    # has a non-default base: E11 T10 opened 15 PRs and CodeRabbit skipped 14 with
    # "reviews are disabled for this base branch". Entries are regex, and `.*`
    # matches every branch.
    base_branches:
      - ".*"
  path_filters:
    - "!web/src/lib/api/schema.d.ts" # generated by `npm run gen:api`
    - "!web/package-lock.json"
    - "!server/uv.lock"
    - "!skills-lock.json"
    - "!odd/**" # ODD feature docs: process records, not product
  path_instructions:
    - path: "**"
      instructions: |
        - docs/ and docs/adr/ are the source of truth (AGENTS.md "Docs are the primary
          source"). Before suggesting a behavior change, check the owning doc; when code
          matches the doc, do not propose a different design. Flag code that contradicts
          a doc instead.
        - Every commit was already reviewed locally (receipt-driven review, "RDD"). Known
          non-blocking findings are tracked in GitHub issues labeled `review-follow-up`,
          listed in the PR description. Do not re-raise a finding already tracked there;
          reference the issue number instead.
        - Use the domain terms of docs/00-glosario.md.
    - path: "server/src/**"
      instructions: |
        - Hexagonal per module (ADR-0002): `domain` has no I/O, `application` depends only
          on `domain`, `adapters` on `application`. Cross-module reads go through the other
          module's `application` facade (docs/05).
        - Every repository query filters by `org_id`; a cross-org read is a 404, never an
          empty 200 (docs/09).
        - Missing evidence is `null`, never `0` or `false`. "Today" is America/Bogota.
        - Pydantic only at the adapter boundary, never in `domain`.
    - path: "server/tests/**"
      instructions: |
        - Every behavior test carries a negative assertion. Test doubles only at ports for
          external I/O. Tests run in random order (pytest-randomly): flag shared state.
    - path: "web/src/**"
      instructions: |
        - Design system and screens follow docs/07 and ADR-0006; the E1 design is frozen.
          Do not suggest visual redesigns. UI copy is Spanish where docs/07 requires it.

knowledge_base:
  code_guidelines:
    filePatterns:
      - "AGENTS.md"
  learnings:
    scope: local
