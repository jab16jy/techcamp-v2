# Scenario A of docs/06-diseno-detallado.md:473-480: water stress, a critical
# alert and a "water X mm" recommendation. The arithmetic is docs/06:442-448 and
# test_scenario_library.py asserts it against these numbers.
# Owner decision #340 (2026-10-25): the sowing age places the window (ages
# 48-62) inside the catalog's mid stage (45-76), so Kc = 1.20 and the
# docs/06:442-448 arithmetic holds without touching the catalog.
name: el-nino
description: Estrés hídrico por El Niño en maíz (escenario A)
plot: { crop: maize, sown_days_ago: 48, area_ha: 1.5, soil: sandy_loam, irrigation_system: drip }
soil: { field_capacity_pct: 23, wilting_point_pct: 9 }   # franco arenoso, FAO-56 Tabla 19
nodes: { count: 2, soil_moisture_depth_cm: 30, calibration: field }
interval_s: 900            # intervalo simulado entre lecturas del backfill
weather_fixture: el-nino-caribe.json   # ETc ≈ 5 mm/día → p = 0,55
weather_fixture_sha256: 625b05ccaedf2c9c96ac9e353f2b6fe2a505593037d2050e99f01ed4483c90ee
trajectories:
  soil_moisture_30cm: { start: 22, end: 13, noise: 0.8 }   # % volumétrico; cruza θ_estrés = 15,3 % el día 10,4
  air_temp: { daily_min: 26, daily_max: 37, noise: 0.5 }   # daily_max > 35 °C abre heat_stress
  air_rh: { daily_min: 38, daily_max: 70, noise: 0.4 }     # bajo 85 %, así que no fungal_risk
faults:
  # The node goes silent on day 10 and never comes back inside the window: the
  # completeness gap and the seq jump on a live resume are what this fault
  # demonstrates (D-T16.8). D-T16.13: node_offline is decided on REAL arrival
  # silence (last_seen_at, margin 3 x interval_s), which a compressed backfill
  # never accumulates, so the alert is not part of this scenario's oracle.
  - { at_day: 10, node: 2, type: offline, hours: 96 }
expected:
  alerts: [water_stress, heat_stress]
  irrigation: irrigate