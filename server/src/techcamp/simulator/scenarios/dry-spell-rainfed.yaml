# Scenario E of docs/06-diseno-detallado.md:473-480: a rainfed plot with no node,
# so the balance runs on weather alone with K = 0. The arithmetic is
# docs/06:465-471 and test_scenario_library.py asserts it against these numbers.
# Owner decision #340 (2026-10-25): the sowing age places the window (ages
# 55-75) inside the catalog's mid stage (45-76), so Kc = 1.20 and the
# docs/06:465-471 arithmetic holds; the catalog's stage lengths themselves stay
# pending agronomic validation.
name: dry-spell-rainfed
description: Veranillo durante la floración en maíz de secano (escenario E)
plot: { crop: maize, sown_days_ago: 55, area_ha: 2, soil: sandy_loam, irrigation_system: none }   # etapa mid (floración)
soil: { field_capacity_pct: 23, wilting_point_pct: 9 }   # franco arenoso, FAO-56 Tabla 19
nodes: { count: 0 }        # parcela sin sensor: el balance corre solo con clima
interval_s: 900
weather_fixture: veranillo-caribe.json   # ET0 ≈ 4,2 mm/día y ninguna lluvia > 5 mm en los 21 días ni en los 7 de pronóstico
weather_fixture_sha256: e6b1dcfd3f8fccdc68dba1cca31a8ea26e91bd37b8d6501e3a777021386f4706
expected:
  alerts: [water_stress]   # abierta por el balance diario; crítica desde el día 18
  irrigation: rainfed      # kind de irrigation_recommendation: sin lámina ni minutos
  advice: [conserve_moisture]