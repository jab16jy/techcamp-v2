# Scenario C of docs/06-diseno-detallado.md:473-480: a node goes down, the alert
# reaches the technician and completeness observes the gap.
#
# D-T16.8: an `offline` fault is a publish pause. The node publishes nothing for
# `hours`, then `seq` jumps; the gap is what completeness sees and nothing
# rewrites the readings already ingested.
name: node-failure
description: "Nodo caído: alerta al técnico y hueco en la completitud (escenario C)"
plot: { crop: maize, sown_days_ago: 42, area_ha: 1.5, soil: sandy_loam, irrigation_system: drip }
soil: { field_capacity_pct: 23, wilting_point_pct: 9 }   # franco arenoso, FAO-56 Tabla 19
nodes: { count: 2, soil_moisture_depth_cm: 30, calibration: field }
# D-T16.13: node health decides on REAL arrival silence with a margin of
# 3 x the node's interval_s. C is the scenario that pays it: at 300 s the
# margin is 15 min, so its e2e (nightly) waits the real silence out while the
# healthy node keeps publishing live.
interval_s: 300
weather_fixture: normal-caribe.json   # ventana benigna: el único problema es el nodo caído
weather_fixture_sha256: 6a729451fa5f440f486da57f4c58ccf61bdf550f3b0ed4c2fc3eba4a886a89bc
trajectories:
  soil_moisture_30cm: { start: 21, end: 19.5, noise: 0.6 }   # el nodo 1 sigue leyendo: el suelo no es el problema
  air_temp: { daily_min: 25, daily_max: 33, noise: 0.5 }   # bajo 35 °C: aquí no hay heat_stress
  air_rh: { daily_min: 52, daily_max: 82, noise: 0.6 }     # bajo 85 %: aquí no hay fungal_risk
faults:
  # The node goes down on day 4 and stays down past the window and into the
  # live phase: the story is a FAILURE, not a blip — the technician's alert
  # opens on the real silence while node 1 keeps reporting, and the
  # completeness gap is observable the whole time (docs/06:477).
  - { at_day: 4, node: 2, type: offline, hours: 480 }
expected:
  alerts: [node_offline]
  irrigation: not_needed      # el balance sigue con el nodo 1: Dr bajo RAW