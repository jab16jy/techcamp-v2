# The contrast scenario of docs/06-diseno-detallado.md:473-480: stable operation,
# nothing opens. Its value is that the other five are read against it — a
# recommendation here is the same recommendation a well-kept plot gets.
name: normal
description: Operación estable en maíz, para contrastar (escenario normal)
plot: { crop: maize, sown_days_ago: 35, area_ha: 1.5, soil: sandy_loam, irrigation_system: drip }
soil: { field_capacity_pct: 23, wilting_point_pct: 9 }   # franco arenoso, FAO-56 Tabla 19
nodes: { count: 2, soil_moisture_depth_cm: 30, calibration: field }
interval_s: 900
weather_fixture: normal-caribe.json   # ET0 ≈ 4,3 mm/día sin lluvia efectiva
weather_fixture_sha256: 6a729451fa5f440f486da57f4c58ccf61bdf550f3b0ed4c2fc3eba4a886a89bc
trajectories:
  soil_moisture_30cm: { start: 22, end: 21, noise: 0.5 }   # sobre θ_estrés = 15,3 % todo el backfill
  air_temp: { daily_min: 25, daily_max: 31, noise: 0.4 }   # bajo 35 °C
  air_rh: { daily_min: 55, daily_max: 78, noise: 0.5 }     # bajo 85 %
expected:
  alerts: []
  irrigation: not_needed      # Dr bajo RAW: el cultivo todavía tiene reserva