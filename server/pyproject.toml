[project]
name = "techcamp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "johan borrero", email = "johanbm0609@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiomqtt>=2.5.1",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "geoalchemy2>=0.20.0",
    "httpx>=0.28.1",
    # Pinned exactly, not a range: Alembic migration `231a40930eb5` applies
    # `SchemaManager.get_schema()` from the *installed* library, so a floating
    # range would apply a different schema to a database whose Alembic version
    # is already recorded. Upgrading needs a new migration (see that file).
    "procrastinate==3.10.0",
    "psycopg[binary]>=3.3.6",
    "pyjwt[crypto]>=2.14.0",
    "pywebpush>=2.0.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["techcamp"]
strict = true

[[tool.mypy.overrides]]
# asyncpg ships no stubs/py.typed marker (E4 T6: the raw `LISTEN` connection).
module = "asyncpg.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Neither pywebpush nor its py_vapid dependency ships a py.typed marker (E7 T7b:
# the Web Push transport). `WebPushException.status_code` is the one value read
# off them, and the transport re-checks it before acting on it, so an untyped
# import costs the boundary its annotation, not a runtime assumption.
module = ["pywebpush.*", "py_vapid.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "techcamp"

[[tool.importlinter.contracts]]
name = "Hexagonal layers per module"
type = "layers"
layers = [
    "adapters",
    "application",
    "domain",
]
containers = [
    "techcamp.identity",
    "techcamp.farms",
    "techcamp.telemetry",
    "techcamp.weather",
    "techcamp.irrigation",
    "techcamp.alerts",
    "techcamp.notifications",
    "techcamp.logbook",
    "techcamp.risk",
    "techcamp.metrics",
    "techcamp.assistant",
]
