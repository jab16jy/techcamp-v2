name: CI

# Pull requests only: every change reaches main through a PR whose checks already ran,
# so re-running the suites on the merge push to main only spends Actions minutes.
on:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: docker.io/timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: techcamp
          POSTGRES_PASSWORD: techcamp
          POSTGRES_DB: techcamp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U techcamp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://techcamp:techcamp@localhost:5432/techcamp
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - run: npm run size
