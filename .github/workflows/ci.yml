name: CI

# Pull requests only: every change reaches main through a PR whose checks already ran,
# so re-running the suites on the merge push to main only spends Actions minutes.
on:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: docker.io/timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: techcamp
          POSTGRES_PASSWORD: techcamp
          POSTGRES_DB: techcamp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U techcamp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://techcamp:techcamp@localhost:5432/techcamp
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run lint-imports
      # The one check `just gate-fast` had and CI did not (D-T1.6, Refs #193): a branched
      # migration history is one `alembic heads` line per head, and only a merge revision
      # repairs it. The same assertion as the recipe, spelled out because CI calls the
      # tools directly and never `just`.
      - name: single alembic head
        run: |
          heads=$(uv run alembic heads | wc -l)
          if [ "$heads" -ne 1 ]; then
            echo "expected exactly 1 Alembic head, found $heads:" >&2
            uv run alembic heads >&2
            exit 1
          fi
      # The rules in ../rules are the invariants a review used to catch by hand, and
      # their tests fail the build when a rule stops reporting what it claims. The config
      # is named explicitly on both lines, exactly as `just gate-fast` names it, so the
      # two resolve the same file from the same working directory.
      - name: ast-grep rule tests
        run: uv run ast-grep test --config ../sgconfig.yml
      - name: ast-grep scan
        run: uv run ast-grep scan --config ../sgconfig.yml
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - run: npm run size
