name: CI

# Pull requests only: every change reaches main through a PR whose checks already ran,
# so re-running the suites on the merge push to main only spends Actions minutes.
on:
  pull_request:

# One in-flight run per PR: a second push to the same PR cancels the first. `github.workflow`
# scopes the group to this workflow, the PR number to one PR (D-T5b.1).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Classifies the PR's changed files once, so `server` and `web` are filtered per job —
  # never by a workflow-level `paths:`, which leaves checks pending (D-T5b.1, D-T5b.2).
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      ml: ${{ steps.filter.outputs.ml }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A range over history: the merge base is what makes the diff the PR's own (D-T5b.2).
          fetch-depth: 0
      - id: filter
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          merge_base=$(git merge-base "$PR_BASE" "$PR_HEAD")
          # `quotePath=false`: git C-quotes a path with non-ASCII bytes by default, and the
          # quoted form no longer starts with a tree prefix, which would skip a suite this PR
          # does touch (R4-CHANGES-QUOTED-PATH, Refs #196).
          changed=$(git -c core.quotePath=false diff --name-only "$merge_base" "$PR_HEAD")
          echo "merge base: $merge_base"
          echo "changed files:"
          printf '%s\n' "$changed"
          # The paths each job reads, nothing wider; `.github/workflows/` is in both: the
          # change that can break a job's own steps must never skip it. Over the three-dot
          # diff, so it is GitHub's own list; no paths-filter action (D-T5b.2, D-T5b.4, D-T5b.5).
          server_paths='^(server|infra|rules|rule-tests)/|^justfile$|^sgconfig\.yml$|^\.github/workflows/'
          ml_paths='^ml/|^justfile$|^\.github/workflows/'
          web_paths='^web/|^\.github/workflows/'
          if printf '%s\n' "$changed" | grep -Eq "$server_paths"; then
            echo "server=true" >> "$GITHUB_OUTPUT"
          else
            echo "server=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -Eq "$ml_paths"; then
            echo "ml=true" >> "$GITHUB_OUTPUT"
          else
            echo "ml=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -Eq "$web_paths"; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  server:
    # Fail-closed: only a successful `changes` saying "no" skips this, because a skipped
    # job reports "Success"; `!cancelled()` still stops a superseded run (D-T5b.3).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.server == 'true') }}
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: docker.io/timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: techcamp
          POSTGRES_PASSWORD: techcamp
          POSTGRES_DB: techcamp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U techcamp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://techcamp:techcamp@localhost:5432/techcamp
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run lint-imports
      # The one check `gate-fast` had and CI did not; CI calls the tools, never `just` (D-T2.4).
      - name: single alembic head
        run: |
          heads=$(uv run alembic heads | wc -l)
          if [ "$heads" -ne 1 ]; then
            echo "expected exactly 1 Alembic head, found $heads:" >&2
            uv run alembic heads >&2
            exit 1
          fi
      # Rules named from `server` with the config explicit, exactly as `gate-fast` (D-T2.7).
      - name: ast-grep rule tests
        run: uv run ast-grep test --config ../sgconfig.yml
      - name: ast-grep scan
        run: uv run ast-grep scan --config ../sgconfig.yml
      - run: uv run pytest

  ml:
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ml == 'true') }}
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest

  web:
    # The same condition as `server`, and the same reason (D-T5b.3).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - run: npm run size

  # docs/09:78 requires gitleaks in CI: the pinned binary, not gitleaks/gitleaks-action
  # (D-T5.1). Always-on, with no `if:` and no `needs:` (D-T5b.5).
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # A range over history, and the merge base is not computable from a depth-1 checkout
          # (D-T5.2).
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/gitleaks"
          mkdir -p "$work"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "$work/$archive" "$release/$archive"
          # The release publishes one checksum per asset (D-T5.1).
          curl -sSfL --retry 3 -o "$work/checksums.txt" "$release/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          expected=$(grep " $archive\$" "$work/checksums.txt" | cut -d' ' -f1)
          echo "$expected  $work/$archive" | sha256sum -c -
          tar -xzf "$work/$archive" -C "$work" gitleaks
          # merge-base(base, head)..head with --remerge-diff (D-T5.2, D-T5.4), git 2.36+:
          # a second-parent lane and a conflict resolution are read, main is not re-reported.
          scan_from=$(git merge-base "$PR_BASE" "$PR_HEAD")
          # Four non-secrets on main are outside this range. A new finding is a line-scoped
          # `# gitleaks:allow`, never a blanket allowlist — and prose here can re-arm the rule
          # itself, which is how the sensor metric name is named instead of pasted (D-T5.3).
          "$work/gitleaks" git --no-banner -v --redact \
            --log-opts="--remerge-diff $scan_from..$PR_HEAD"
