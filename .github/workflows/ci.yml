name: CI

# Pull requests only: every change reaches main through a PR whose checks already ran,
# so re-running the suites on the merge push to main only spends Actions minutes.
on:
  pull_request:

# One in-flight run per PR: a second push to the same PR cancels the first, so a review
# round costs one run instead of one per commit, and a superseded run stops spending the
# ~7 min server job. `github.workflow` keeps the group scoped to THIS workflow, which is
# the current docs' own recommendation: a bare `github.ref` would cancel the runs of
# every other workflow on the same ref. The PR number is the per-PR ref — for a
# `pull_request` event `github.ref` is already `refs/pull/<n>/merge` — and it stays as
# the fallback if a `push` trigger is ever added (D-T5b.1).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Which jobs this PR needs at all. It always runs, it is the only place a changed file
  # is classified, and nothing waits for it except the two filtered jobs.
  #
  # The filter is per JOB, never a workflow-level `on.pull_request.paths`, and the two
  # facts that force that are both in the current docs: a workflow skipped by path
  # filtering leaves its checks "Pending" and blocks a PR that requires them, while a job
  # skipped by a job-level `if:` reports "Success" and satisfies the requirement. So
  # `gitleaks` carries no `if:` and no `needs:` at all — always-on, and ungated by this
  # job (D-T5b.1, D-T5b.5).
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The same reason and the same depth as the gitleaks job: the diff is a range
          # over history, and the merge base is what makes it the PR's own changes.
          fetch-depth: 0
      - id: filter
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # GitHub builds a pull request's changed-file list from the three-dot diff
          # (workflow syntax, "Git diff comparisons"), so this is the very list a
          # `paths:` filter would have matched — and the very range `gitleaks` scans.
          merge_base=$(git merge-base "$PR_BASE" "$PR_HEAD")
          changed=$(git diff --name-only "$merge_base" "$PR_HEAD")
          echo "merge base: $merge_base"
          echo "changed files:"
          printf '%s\n' "$changed"
          # The paths each job actually reads, and nothing wider.
          #  - server: its own tree; `sgconfig.yml`, `rules/` and `rule-tests/`, which its
          #    two ast-grep commands name from the repository root; the `justfile`, which
          #    mirrors its check list; `infra/`, whose compose file and Postgres
          #    extensions describe the database this same suite runs against locally, so
          #    a divergence from this job's service image surfaces here and not in a
          #    seminar; and `.github/workflows/`, which is what this job runs.
          #  - web: its own tree and `.github/workflows/`. It reads nothing at the root.
          # `.github/workflows/` is in both on purpose: the one change that can break a
          # job's own steps must never be the change that skips that job (D-T5b.4).
          # No `dorny/paths-filter` and no API call: the checkout already has the
          # history these few `grep` lines read (D-T5b.2).
          server_paths='^(server|infra|rules|rule-tests)/|^justfile$|^sgconfig\.yml$|^\.github/workflows/'
          web_paths='^web/|^\.github/workflows/'
          if printf '%s\n' "$changed" | grep -Eq "$server_paths"; then
            echo "server=true" >> "$GITHUB_OUTPUT"
          else
            echo "server=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -Eq "$web_paths"; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  server:
    # Runs unless `changes` positively decided this PR touches nothing this job reads.
    # Written that way on purpose: a skipped job reports "Success", so the plain
    # `if: needs.changes.outputs.server == 'true'` would turn a `changes` job that itself
    # failed — a checkout that could not fetch, a merge base that was not there — into a
    # green PR with no server suite at all. This way anything the filter could not decide
    # runs the full gate. `!cancelled()` and not `always()`, so a superseded run from
    # `concurrency` still stops instead of starting a 7 min job nobody is waiting for
    # (D-T5b.3).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.server == 'true') }}
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: docker.io/timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: techcamp
          POSTGRES_PASSWORD: techcamp
          POSTGRES_DB: techcamp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U techcamp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://techcamp:techcamp@localhost:5432/techcamp
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run lint-imports
      # The one check `just gate-fast` had and CI did not (D-T1.6, Refs #193): a branched
      # migration history is one `alembic heads` line per head, and only a merge revision
      # repairs it. The same assertion as the recipe, spelled out because CI calls the
      # tools directly and never `just`.
      - name: single alembic head
        run: |
          heads=$(uv run alembic heads | wc -l)
          if [ "$heads" -ne 1 ]; then
            echo "expected exactly 1 Alembic head, found $heads:" >&2
            uv run alembic heads >&2
            exit 1
          fi
      # The rules in ../rules are the invariants a review used to catch by hand, and
      # their tests fail the build when a rule stops reporting what it claims. The config
      # is named explicitly on both lines, exactly as `just gate-fast` names it, so the
      # two resolve the same file from the same working directory.
      - name: ast-grep rule tests
        run: uv run ast-grep test --config ../sgconfig.yml
      - name: ast-grep scan
        run: uv run ast-grep scan --config ../sgconfig.yml
      - run: uv run pytest

  web:
    # The same condition as `server`, and the same reason (D-T5b.3).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - run: npm run size

  # docs/09:78 requires gitleaks in CI. The tool is MIT and needs no licence key on a
  # personal account, so this runs the pinned binary instead of gitleaks/gitleaks-action
  # (D-T5.1): the action is licensed by Gitleaks LLC, and it decides whether a key is
  # needed by asking the GitHub API whether this account is an organization — a failed
  # call there exits the job with "missing gitleaks license" on the one kind of account
  # that needs no key at all.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The scan is a range over history, so the merge ref a depth-1 checkout leaves
          # behind is not enough to compute the merge base.
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/gitleaks"
          mkdir -p "$work"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "$work/$archive" "$release/$archive"
          # The release publishes one checksum per asset, so this runs the binary the
          # release published rather than whatever the download returned.
          curl -sSfL --retry 3 -o "$work/checksums.txt" "$release/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          expected=$(grep " $archive\$" "$work/checksums.txt" | cut -d' ' -f1)
          echo "$expected  $work/$archive" | sha256sum -c -
          tar -xzf "$work/$archive" -C "$work" gitleaks
          # The merge base, not the base tip: only the commits this PR adds are judged as
          # this PR's, so a commit that is already on main can never fail an unrelated PR
          # (D-T5.2). Three walk flags, each one proven on a scratch branch:
          #  - no --first-parent: it walks only the first-parent chain, so a lane merged
          #    in through a second parent is never visited at all.
          #  - no --no-merges: a conflict resolution exists in no other commit, so
          #    dropping the merge drops a secret nobody else carries.
          #  - --remerge-diff, not -m: -m diffs a merge against each parent, so merging
          #    main in re-reports all of main. --remerge-diff diffs against git's own
          #    re-merge, so only what the resolution wrote shows. Needs git 2.36 or newer,
          #    which ubuntu-latest ships.
          scan_from=$(git merge-base "$PR_BASE" "$PR_HEAD")
          # The default rules read three non-secrets in web test fixtures as keys, all on
          # main and so outside this range: a sensor metric name assigned to a `channel_key`
          # field, and a VAPID public key. The first is described rather than pasted here
          # because writing the assignment out re-arms the rule on this very file — it did,
          # in the commit that added this job. A new finding is a line-scoped
          # `# gitleaks:allow` on the line that trips it, never a blanket allowlist of the
          # test tree.
          "$work/gitleaks" git --no-banner -v --redact \
            --log-opts="--remerge-diff $scan_from..$PR_HEAD"
