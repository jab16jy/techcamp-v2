name: PR validation

# The PR's own title, labels and body (#234). Separate from CI so a label edit never
# re-runs the suites. Not a required check: this repo is on the free plan and cannot
# configure one (D-T5b.1), so the title rule is visible, not enforced by the platform.
#
# The Conventional Commit title is a hard failure: it becomes the squash commit and the
# changelog line. The labels and the issue reference only warn, because most merged PRs
# never carried them and a check that is red on nearly every PR teaches people to ignore
# it (D-T4.1). The warnings show as annotations and in the job summary.
#
# No checkout and no token scopes: the job runs only what is written below, never a file
# from the PR's tree, and the values arrive through the environment, never interpolated
# into the script.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  pr-validation:
    # Dependabot titles and bodies are generated and carry no epic or issue.
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        shell: bash
        run: |
          set -euo pipefail
          labels=$(jq -r '.[]' <<<"${PR_LABELS_JSON:-[]}")
          # A scope may name several modules: fix(irrigation,farms,telemetry): ...
          title_re='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/,-]+\))?!?: .+'
          warn() {
            echo "::warning title=PR validation::$1"
            echo "- warning: $1" >>"$GITHUB_STEP_SUMMARY"
          }
          failed=0
          if ! [[ $PR_TITLE =~ $title_re ]]; then
            echo "::error title=PR validation::the title is not a Conventional Commit: <type>(<scope>): <summary>"
            echo "- error: the title '$PR_TITLE' is not a Conventional Commit" >>"$GITHUB_STEP_SUMMARY"
            failed=1
          fi
          grep -q '^epic:' <<<"$labels" || warn "no epic:* label"
          grep -q '^type:' <<<"$labels" || warn "no type:* label"
          grep -Eiq '(refs|closes|fixes|resolves) #[0-9]+' <<<"${PR_BODY:-}" || warn "the body has no Refs/Closes #N"
          exit "$failed"
