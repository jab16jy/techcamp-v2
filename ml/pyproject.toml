[project]
name = "techcamp-ml"
version = "0.1.0"
description = "TechCamp v2 ML models, datasets, and harness"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "lightgbm>=4.7",
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn>=1.9",
    "techcamp",
]

[tool.uv.sources]
techcamp = { path = "../server", editable = true }

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-randomly>=5.0.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["techcamp_ml"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["techcamp_ml"]
strict = true

[[tool.mypy.overrides]]
# pandas ships neither stubs nor a py.typed marker (T3: the M2 source parsers shape
# frames with it). The parsers are typed at their own boundary — they take bytes and
# return a `pd.DataFrame` with a named, tested column list — so an untyped import
# costs the annotations, not a runtime assumption about a column.
module = ["pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# scikit-learn ships no `py.typed` marker either. T5's harness calls three of its metric
# functions and nothing else, each returning a float or the arrays
# `precision_recall_curve` documents; the bootstrap loop of ADR-0020 step 8 depends on the
# pairing those three have, which is pinned by T5's own tests rather than by the stubs.
module = ["sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The server package ships no `py.typed` marker, and T4 imports its domain features
# (docs/08 §Estructura de `ml/`: "las features se importan de
# `techcamp.risk.domain.features`"). Following the import keeps the real annotations of
# the shared module, so the call that builds every feature of the dataset is checked
# against the one the serving job calls.
module = ["techcamp.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
