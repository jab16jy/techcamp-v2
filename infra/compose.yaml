services:
  postgres:
    image: docker.io/timescale/timescaledb-ha:pg16
    profiles: [seminar]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-techcamp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techcamp}
      POSTGRES_DB: ${POSTGRES_DB:-techcamp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/home/postgres/pgdata/data
      - ./postgres/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techcamp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: docker.io/eclipse-mosquitto:2
    profiles: [seminar]
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro,Z
      - mosquitto-data:/mosquitto/data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: [seminar]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-techcamp}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-techcamp123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  minio-init:
    # One-shot: create the logbook photo bucket AND the ML artifact bucket
    # (ADR-0021: MinIO in the seminar profile; ADR-0018: the presigned upload the
    # API emits needs the first to exist, and docs/08-ml.md puts datasets and
    # model artifacts under `datasets/<name>/<hash>/` and `models/<name>/<version>/`
    # in their own bucket, separate from photos).
    #
    # It builds from the same local context as the rest of the server services
    # and creates the buckets with the `boto3` the API signs with. It used to be
    # `quay.io/minio/mc`, which denies anonymous pulls: an init container whose
    # image cannot be pulled is a stack that does not come up (#214). Nothing is
    # downloaded from a registry to run it now.
    #
    # The module is best-effort: the store may still be booting, and a store
    # that never answers must not keep the stack down - the photo upload is the
    # only feature that needs the buckets. It exits zero when the store never
    # answered (the stack comes up without them) and one when the store
    # answered and the creation failed, which is a misconfiguration worth
    # stopping for.
    build:
      context: ../server
    profiles: [seminar]
    restart: "no"
    command: ["python", "-m", "techcamp.init_buckets"]
    environment:
      TECHCAMP_PROFILE: ${TECHCAMP_PROFILE:-seminar}
      TECHCAMP_S3_INTERNAL_URL: ${TECHCAMP_S3_INTERNAL_URL:-http://minio:9000}
      TECHCAMP_S3_BUCKET: ${TECHCAMP_S3_BUCKET:-logbook-photos}
      TECHCAMP_S3_ML_BUCKET: ${TECHCAMP_S3_ML_BUCKET:-ml-artifacts}
      TECHCAMP_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-techcamp}
      TECHCAMP_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-techcamp123}
      TECHCAMP_S3_REGION: ${TECHCAMP_S3_REGION:-us-east-1}
    depends_on:
      - minio

  migrate:
    build:
      context: ../server
    profiles: [seminar]
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    environment:
      TECHCAMP_PROFILE: ${TECHCAMP_PROFILE:-seminar}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-techcamp}:${POSTGRES_PASSWORD:-techcamp}@postgres:5432/${POSTGRES_DB:-techcamp}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../server
    profiles: [seminar]
    environment:
      TECHCAMP_PROFILE: ${TECHCAMP_PROFILE:-seminar}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-techcamp}:${POSTGRES_PASSWORD:-techcamp}@postgres:5432/${POSTGRES_DB:-techcamp}
      # Object storage for logbook photos (ADR-0018, ADR-0021). The URL is the
      # one the BROWSER uploads to, so it is the published MinIO port and not the
      # in-network `minio:9000`. The keys default to the MinIO root user above
      # only in the seminar profile; left empty here, `shared/config.py` falls
      # back to that same emulator credential in seminar and to nothing in
      # production, which answers 503 rather than inventing a credential.
      TECHCAMP_S3_PUBLIC_URL: ${TECHCAMP_S3_PUBLIC_URL:-http://localhost:9000}
      TECHCAMP_S3_BUCKET: ${TECHCAMP_S3_BUCKET:-logbook-photos}
      TECHCAMP_S3_ACCESS_KEY: ${TECHCAMP_S3_ACCESS_KEY:-}
      TECHCAMP_S3_SECRET_KEY: ${TECHCAMP_S3_SECRET_KEY:-}
      TECHCAMP_S3_REGION: ${TECHCAMP_S3_REGION:-us-east-1}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # The bucket has to exist before the first photo is presigned; the API
      # signs the URL, MinIO only rejects the PUT if the bucket is missing.
      minio-init:
        condition: service_completed_successfully

  ingestor:
    build:
      context: ../server
    profiles: [seminar]
    restart: unless-stopped
    command: ["python", "-m", "techcamp.ingestor"]
    environment:
      TECHCAMP_PROFILE: ${TECHCAMP_PROFILE:-seminar}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-techcamp}:${POSTGRES_PASSWORD:-techcamp}@postgres:5432/${POSTGRES_DB:-techcamp}
      MQTT_HOST: mosquitto
      MQTT_PORT: ${MQTT_PORT:-1883}
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ../server
    profiles: [seminar]
    restart: unless-stopped
    command: ["python", "-m", "techcamp.worker"]
    environment:
      TECHCAMP_PROFILE: ${TECHCAMP_PROFILE:-seminar}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-techcamp}:${POSTGRES_PASSWORD:-techcamp}@postgres:5432/${POSTGRES_DB:-techcamp}
      # procrastinate evaluates a periodic task's cron in the process's local
      # time, and every job hour in the orchestration DAG is America/Bogota
      # (docs/10-dag.md:156).
      TZ: America/Bogota
      # Web Push is real in both profiles (ADR-0021:26), so the worker needs the
      # private half of the VAPID key pair: the base64 DER of the EC2 private key
      # (`openssl ecparam -name prime256v1 -genkey`, then base64 the DER, or let
      # `py_vapid` write it). D32 pairs it with the browser bundle: the PUBLIC
      # half of this same key must be what the web build gets as
      # `VITE_VAPID_PUBLIC_KEY` (web/README.md), or the browser subscribes and the
      # push service rejects every send. Unset is not an error — the `push` channel
      # stays unregistered, exactly as the web app stays quiet when its variable is
      # unset (D31: a channel nobody can send is not even claimed).
      TECHCAMP_VAPID_PRIVATE_KEY: ${TECHCAMP_VAPID_PRIVATE_KEY:-}
      TECHCAMP_VAPID_SUBJECT: ${TECHCAMP_VAPID_SUBJECT:-mailto:notificaciones@techcamp.local}
      # ML artifacts for the daily flood job (docs/08-ml.md). The URL is NOT the
      # public one the browser uploads photos to: inside this container
      # `localhost:9000` is the container itself, so the public URL would point
      # the worker at nothing — MinIO answers on the service name from in here.
      # The bucket is separate from the photos on purpose (ADR-0018): one
      # service, one bucket per kind of object. `api` gets neither variable
      # because it never reads a model artifact.
      TECHCAMP_S3_INTERNAL_URL: ${TECHCAMP_S3_INTERNAL_URL:-http://minio:9000}
      TECHCAMP_S3_ML_BUCKET: ${TECHCAMP_S3_ML_BUCKET:-ml-artifacts}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # The daily job loads its artifact from this bucket; without it the first
      # run after a fresh volume has nothing to download.
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: ../web
    profiles: [seminar]
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8000}
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      - api

volumes:
  postgres-data:
  mosquitto-data:
  minio-data:
