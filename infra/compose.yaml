services:
  postgres:
    image: docker.io/timescale/timescaledb-ha:pg16
    profiles: [seminar]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-techcamp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techcamp}
      POSTGRES_DB: ${POSTGRES_DB:-techcamp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/home/postgres/pgdata/data
      - ./postgres/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techcamp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: docker.io/eclipse-mosquitto:2
    profiles: [seminar]
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro,Z
      - mosquitto-data:/mosquitto/data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: [seminar]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-techcamp}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-techcamp123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  migrate:
    build:
      context: ../server
    profiles: [seminar]
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    environment:
      TECHCAMP_PROFILE: ${TECHCAMP_PROFILE:-seminar}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-techcamp}:${POSTGRES_PASSWORD:-techcamp}@postgres:5432/${POSTGRES_DB:-techcamp}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../server
    profiles: [seminar]
    environment:
      TECHCAMP_PROFILE: ${TECHCAMP_PROFILE:-seminar}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-techcamp}:${POSTGRES_PASSWORD:-techcamp}@postgres:5432/${POSTGRES_DB:-techcamp}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  ingestor:
    build:
      context: ../server
    profiles: [seminar]
    restart: unless-stopped
    command: ["python", "-m", "techcamp.ingestor"]
    environment:
      TECHCAMP_PROFILE: ${TECHCAMP_PROFILE:-seminar}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-techcamp}:${POSTGRES_PASSWORD:-techcamp}@postgres:5432/${POSTGRES_DB:-techcamp}
      MQTT_HOST: mosquitto
      MQTT_PORT: ${MQTT_PORT:-1883}
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ../server
    profiles: [seminar]
    restart: unless-stopped
    command: ["python", "-m", "techcamp.worker"]
    environment:
      TECHCAMP_PROFILE: ${TECHCAMP_PROFILE:-seminar}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-techcamp}:${POSTGRES_PASSWORD:-techcamp}@postgres:5432/${POSTGRES_DB:-techcamp}
      # procrastinate evaluates a periodic task's cron in the process's local
      # time, and every job hour in the orchestration DAG is America/Bogota
      # (docs/10-dag.md:156).
      TZ: America/Bogota
      # Web Push is real in both profiles (ADR-0021:26), so the worker needs the
      # private half of the VAPID key pair: the base64 DER of the EC2 private key
      # (`openssl ecparam -name prime256v1 -genkey`, then base64 the DER, or let
      # `py_vapid` write it). D32 pairs it with the browser bundle: the PUBLIC
      # half of this same key must be what the web build gets as
      # `VITE_VAPID_PUBLIC_KEY` (web/README.md), or the browser subscribes and the
      # push service rejects every send. Unset is not an error — the `push` channel
      # stays unregistered, exactly as the web app stays quiet when its variable is
      # unset (D31: a channel nobody can send is not even claimed).
      TECHCAMP_VAPID_PRIVATE_KEY: ${TECHCAMP_VAPID_PRIVATE_KEY:-}
      TECHCAMP_VAPID_SUBJECT: ${TECHCAMP_VAPID_SUBJECT:-mailto:notificaciones@techcamp.local}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ../web
    profiles: [seminar]
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8000}
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      - api

volumes:
  postgres-data:
  mosquitto-data:
  minio-data:
